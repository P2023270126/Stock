name: Daily Stock Check

on:
  schedule:
    # Weekdays after the US market close
    - cron: '15 22 * * 1-5'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install yfinance requests pandas

      - name: Consolidate market data and build dashboard
        env:
          WA_PHONE: ${{ secrets.WA_PHONE }}
          WA_API_KEY: ${{ secrets.WA_API_KEY }}
        run: python update_data.py

      - name: Publish refreshed dashboard data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html alert_state.json
          git diff --cached --quiet && exit 0
          git commit -m "Update dashboard [skip ci]"
          git push
